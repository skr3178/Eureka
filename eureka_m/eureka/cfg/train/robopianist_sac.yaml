params:
  seed: 42

  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      units: [256, 256, 256]  # Match original SAC config from run.sh
      activation: gelu  # Match original SAC config
      
      initializer:
        name: default
    log_std_bounds: [-5, 2]

  load_checkpoint: False
  load_path: ""

  config:
    name: RoboPianistMujoco_SAC
    full_experiment_name: RoboPianistMujoco_SAC
    env_name: mujoco_robopianist  # Will be set dynamically in train_mujoco.py
    normalize_input: True
    reward_shaper:
      scale_value: 0.01

    max_epochs: 1000
    num_steps_per_episode: 1  # Steps per episode for replay buffer
    save_best_after: 200
    save_frequency: 50  # Note: SACAgent may need save_freq attribute (minor compatibility issue)
    gamma: 0.8  # Match original run.sh discount
    init_alpha: 1.0
    alpha_lr: 3e-4  # Temperature learning rate
    actor_lr: 3e-4  # Match original run.sh
    critic_lr: 3e-4  # Match original run.sh
    critic_tau: 0.005  # Target network soft update coefficient
    batch_size: 16384  # Match original run.sh
    learnable_temperature: True
    num_warmup_steps: 1000  # Match original run.sh warmstart-steps
    replay_buffer_size: 1000000  # 1M transitions
    num_actors: 1

